DISTRO = "saha-microduck"
DISTRO_NAME = "Saha Microduck"
DISTRO_VERSION = "1.0"
DISTRO_CODENAME = "wrynose"
MAINTAINER = "Homalozoa <nx.tardis@gmail.com>"
TARGET_VENDOR = "-cyberzoo"
SDK_VENDOR = "-saha"
LOCALCONF_VERSION = "1"

# Headless runtime: policy inference, ALSA, BlueZ and NetworkManager.
SAHA_MICRODUCK_FEATURES = "acl alsa bluetooth ipv4 ipv6 largefile ldconfig pam seccomp systemd usrmerge wifi xattr zeroconf"
DISTRO_FEATURES = "${SAHA_MICRODUCK_FEATURES}"
# Wrynose adds default features even when DISTRO_FEATURES is set explicitly.
# Opt out of everything outside the application contract, including X11/GL.
DISTRO_FEATURES_OPTED_OUT = "${@' '.join(sorted(set((d.getVar('DISTRO_FEATURES_DEFAULTS') or '').split()) - set(d.getVar('SAHA_MICRODUCK_FEATURES').split())))}"
INIT_MANAGER = "systemd"
INHERIT += "uninative"
BB_SIGNATURE_HANDLER = "OEEquivHash"
BB_HASHSERVE ??= "auto"

# H.264 software encoding backs the low-rate WebRTC test source on both SoCs.
LICENSE_FLAGS_ACCEPTED += "commercial_gstreamer1.0-plugins-ugly commercial_x264"

# Each board layer owns its UART, DT and firmware selection.
include conf/machine/include/${MACHINE}-microduck.inc
