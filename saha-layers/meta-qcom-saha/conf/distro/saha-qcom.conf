DISTRO = "saha-qcom"
DISTRO_NAME = "Saha project distro for Qualcomm Dragonwing"
DISTRO_VERSION_BASE = "alpha-1.0"
DISTRO_VERSION = "${DISTRO_VERSION_BASE}-${DATE}"
DISTRO_CODENAME = "wrynose"
SDK_VENDOR = "-qcom"
SDK_VERSION := "${DISTRO_VERSION}"

MAINTAINER = "Homalozoa <nx.tardis@gmail.com>"
TARGET_VENDOR = "-cyberzoo"

LOCALCONF_VERSION = "1"

DISTRO_VERSION[vardepsexclude] = "DATE"
SDK_VERSION[vardepsexclude] = "DATE"

# Keep the platform-neutral Saha feature contract while adding EFI, which is
# required by the IQ-9075 EVK U-Boot/UEFI boot path.
SAHA_QCOM_DISTRO_FEATURES = "largefile opengl vulkan multiarch systemd pam virtualization wifi efi"
DISTRO_FEATURES ?= "${DISTRO_FEATURES_DEFAULTS} ${SAHA_QCOM_DISTRO_FEATURES}"

INIT_MANAGER = "systemd"

INHERIT += "uninative"

BB_SIGNATURE_HANDLER ?= "OEEquivHash"
BB_HASHSERVE ??= "auto"

LICENSE_FLAGS_ACCEPTED += "commercial_faad2"

SDK_NAME = "${DISTRO}-${TCLIBC}-${SDKMACHINE}-${IMAGE_BASENAME}-${TUNE_PKGARCH}-${MACHINE}"
SDKPATH = "/opt/${DISTRO}/${SDK_VERSION}"
