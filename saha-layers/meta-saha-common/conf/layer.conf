BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "saha-common"
BBFILE_PATTERN_saha-common = "^${LAYERDIR}/"
BBFILE_PRIORITY_saha-common = "40"

LAYERVERSION_saha-common = "1"
LAYERSERIES_COMPAT_saha-common = "wrynose"

# The common packagegroups consume the standard OE networking/filesystem
# packages and the ROS 2 runtime selected by the kas ROS include.
LAYERDEPENDS_saha-common = " \
    core \
    openembedded-layer \
    filesystems-layer \
    networking-layer \
    meta-python \
    ros-common-layer \
    ros2-layer \
"
