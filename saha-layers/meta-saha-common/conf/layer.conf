BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "saha-common"
BBFILE_PATTERN_saha-common = "^${LAYERDIR}/"
BBFILE_PRIORITY_saha-common = "40"

LAYERVERSION_saha-common = "1"
LAYERSERIES_COMPAT_saha-common = "wrynose"

# The common image policy also serves small robots that do not use ROS.
# Only expose the ROS packagegroup when its provider layer is loaded.
BBFILES_DYNAMIC += "ros2-layer:${LAYERDIR}/dynamic-layers/ros2/recipes-saha/packagegroups/*.bb"

# Common tools consume standard OE networking/filesystem packages.
LAYERDEPENDS_saha-common = " \
    core \
    openembedded-layer \
    filesystems-layer \
    networking-layer \
    meta-python \
"
