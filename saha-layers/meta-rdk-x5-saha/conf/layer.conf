BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "rdk-x5-saha"
BBFILE_PATTERN_rdk-x5-saha = "^${LAYERDIR}/"
BBFILE_PRIORITY_rdk-x5-saha = "50"

LAYERVERSION_rdk-x5-saha = "1"
LAYERSERIES_COMPAT_rdk-x5-saha = "wrynose"

# These are deliberate build-time compatibility requirements, not optional
# recommendations: the RDK X5 image packagegroups use their packages and the
# image always carries the RDKOS-validated ROS 2 Jazzy runtime.
LAYERDEPENDS_rdk-x5-saha = " \
    core \
    openembedded-layer \
    filesystems-layer \
    networking-layer \
    meta-python \
    ros-common-layer \
    ros2-layer \
    ros2-jazzy-layer \
    saha-common \
"
